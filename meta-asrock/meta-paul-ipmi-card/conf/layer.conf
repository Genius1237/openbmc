# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "paul-ipmi-card-layer"
BBFILE_PATTERN_paul-ipmi-card-layer = "^${LAYERDIR}/"
LAYERSERIES_COMPAT_paul-ipmi-card-layer = "whinlatter walnascar"
